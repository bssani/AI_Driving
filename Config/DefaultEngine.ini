; --- VR (Quest 3 over Link, OpenXR) ---
; Instanced stereo would draw both eyes in one pass and cost nothing visually, but it kills the
; editor here: one multi-viewport PSO fails to create (D3D12 hash A1455E590FBD9AE6, E_INVALIDARG,
; 3 render targets, no depth) and the RHI treats that as fatal. Tried twice, once with ray
; tracing on and once off, and the failing PSO was byte for byte the same, so ray tracing is not
; the trigger. Substrate is the remaining suspect but turning that off is a material-wide change.
; vr.InstancedStereo=True
